name: MI-R4A

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    concurrency:
      group: MI-R4A-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            unzip libtool-bin curl cmake gperf gawk flex bison nano xxd fakeroot \
            cpio git python3-docutils gettext automake autopoint texinfo build-essential \
            help2man pkg-config zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev \
            libncurses5-dev libltdl-dev wget
          sudo timedatectl set-timezone Asia/Shanghai

      - name: Install UPX
        uses: crazy-max/ghaction-upx@v3
        with:
          version: v4.2.4
          install-only: true

      - name: Prepare source and toolchain
        shell: bash
        env:
          KERNEL: 3.4
        run: |
          set -Eeuo pipefail
          mkdir -p /opt/images
          cd "$GITHUB_WORKSPACE"
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Build Firmware
        shell: bash
        env:
          TNAME: MI-R4A
          KERNEL: 3.4
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/trunk"

          if [ ! -f "configs/templates/${TNAME}.config" ]; then
            echo "configs/templates/${TNAME}.config not found"
            exit 1
          fi

          cp -f "configs/templates/${TNAME}.config" .config
          sed -i 's/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=n/CONFIG_FIRMWARE_INCLUDE_OPENSSL_EXE=y/g' .config

          # helper functions
          disable_feature() { sed -i "/${1}/d" .config || true; }
          set_feature() { echo "${1}=${2}" >> .config; }

          disable_feature "CONFIG_FIRMWARE_ENABLE_IPV6"
          disable_feature "CONFIG_FIRMWARE_ENABLE_USB"
          disable_feature "CONFIG_FIRMWARE_INCLUDE_OPENVPN"

          set_feature "CONFIG_FIRMWARE_ENABLE_IPV6" "y"
          set_feature "CONFIG_FIRMWARE_ENABLE_USB" "y"
          set_feature "CONFIG_FIRMWARE_INCLUDE_CURL" "y"

          sudo ./clear_tree
          sudo ./build_firmware_modify "$TNAME" 0
          sudo mv -f images/*.trx /opt/images/
