name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: "Enable tmate debugging"
        required: false
        default: "no"
  release:
    types: [published]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.build_variant }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}
    env:
      IMAGES_DIR: /opt/images
      TARGETS: ${{ matrix.targets }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_variant: mt7620
            targets: PSG1218
          - build_variant: mt7621-usb
            targets: K2P-USB

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libtool-bin gperf python3-docutils autopoint gettext p7zip-full

      - name: Run shellcheck
        shell: bash
        run: |
          set -euxo pipefail
          sh ./trunk/tools/shellcheck.sh

      - name: Prepare toolchain
        shell: bash
        run: |
          set -euxo pipefail
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Setup tmate session
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'yes' }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Start build
        shell: bash
        run: |
          set -euxo pipefail
          cd trunk
          mkdir -p "${IMAGES_DIR}"

          for m in ${TARGETS}; do
            fakeroot ./build_firmware_ci "$m"
            if [ $? -eq 0 ]; then
              cp -f images/*.trx "${IMAGES_DIR}/$m.trx"
            else
              exit 1
            fi
            ./clear_tree_simple >/dev/null 2>&1
          done

      - name: Create archive
        if: ${{ success() && github.event_name != 'release' }}
        shell: bash
        run: |
          set -euxo pipefail
          ls -lh "${IMAGES_DIR}"

          GIT_VERSION="$(git rev-parse --short=7 HEAD 2>/dev/null || true)"
          if [ -n "${GIT_VERSION}" ]; then
            image_name="images_${{ matrix.build_variant }}_${GIT_VERSION}"
          else
            image_name="images_${{ matrix.build_variant }}"
          fi

          cd "${IMAGES_DIR}"
          md5sum ./*.trx | tee md5sum.txt
          7z a -mx=9 "${image_name}.7z" ./*
          echo "image_name=${image_name}" >> "$GITHUB_ENV"

      - name: Upload images to Artifact
        if: ${{ success() && github.event_name != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.image_name || format('{0}-artifacts', matrix.build_variant) }}
          path: ${{ env.IMAGES_DIR }}/*.7z
          if-no-files-found: error

      - name: Upload images to Releases
        if: ${{ success() && github.event_name == 'release' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.IMAGES_DIR }}/*.trx
          tag: ${{ github.ref_name }}
          overwrite: true
          file_glob: true
